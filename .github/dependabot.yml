version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # TypeScript 7 (Go-Compiler) ist ein eigenes Projekt; @types/node folgt der Laufzeit.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # Pakete, die aneinander hängen: immer zusammen, auch Majors.
      eslint:
        patterns: ["eslint", "@eslint/*", "@eslint-community/*", "eslint-plugin-*", "eslint-config-*", "typescript-eslint", "@typescript-eslint/*", "globals"]
      motion:
        patterns: ["motion", "framer-motion"]
      minor-and-patch:
        update-types: ["minor", "patch"]
        # Mit update-types gilt diese Gruppe als spezifischer und zieht eslint/motion sonst an sich.
        exclude-patterns: ["eslint", "@eslint/*", "@eslint-community/*", "eslint-plugin-*", "eslint-config-*", "typescript-eslint", "@typescript-eslint/*", "globals", "motion", "framer-motion"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      docker:
        patterns: ["*"]
    ignore:
      # Runtime-Majors (Node, Bun) sind eine bewusste Migration, kein Wochen-PR.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
